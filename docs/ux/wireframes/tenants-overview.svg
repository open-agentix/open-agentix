</style><rect width="960" height="280" fill="#f8fafc"/><text x="24" y="40" class="t">Tenants</text><rect x="470" y="22" width="190" height="28" rx="6" class="chip"/><text x="482" y="41" class="m">⌕ Search tenants</text><rect x="672" y="22" width="150" height="28" rx="6" class="btn"/><text x="684" y="41" class="bt">+ Add sub-tenant</text><rect x="834" y="22" width="110" height="28" rx="6" class="chip"/><text x="846" y="41">Month: Oct ▾</text><rect x="24" y="64" width="920" height="170" rx="6" class="box"/><text x="36" y="88" class="m h">TENANT</text><text x="330" y="88" class="m h">AGENTS</text><text x="410" y="88" class="m h">RUNS 30 D</text><text x="500" y="88" class="m h">SPEND / CAP (USD)</text><text x="710" y="88" class="m h">PENDING</text><text x="790" y="88" class="m h">YOUR ROLE</text><text x="36" y="120">▾</text><rect x="50" y="105" width="20" height="20" rx="4" fill="#4f46e5" class="tile"/><text x="53" y="119" class="tt">EO</text><text x="78" y="120" class="h">Example Org</text><text x="330" y="120">1 (6)</text><text x="410" y="120">12 (58)</text><rect x="500" y="112" width="90" height="8" rx="3" class="bar"/><rect x="500" y="112" width="35" height="8" rx="3" fill="#6b7280"/><text x="598" y="120">118 / 300</text><text x="710" y="120">0 (1)</text><text x="790" y="120">Tenant admin</text><text x="60" y="160">▸</text><rect x="74" y="145" width="20" height="20" rx="4" fill="#0f766e" class="tile"/><text x="77" y="159" class="tt">SE</text><text x="102" y="160" class="h">Security</text><text x="330" y="160">3</text><text x="410" y="160">40</text><rect x="500" y="152" width="90" height="8" rx="3" class="bar"/><rect x="500" y="152" width="47" height="8" rx="3" fill="#6b7280"/><text x="598" y="160">63 / 120</text><text x="710" y="160">1</text><text x="790" y="160">Tenant admin ⤓</text><text x="60" y="200"> </text><rect x="74" y="185" width="20" height="20" rx="4" fill="#b45309" class="tile"/><text x="77" y="199" class="tt">PR</text><text x="102" y="200" class="h">Product</text><text x="330" y="200">2</text><text x="410" y="200">6</text><text x="500" y="200">22 / – (inherits 300)</text><text x="710" y="200">0</text><text x="790" y="200">Tenant admin ⤓</text><text x="36" y="230" class="m">(n) = including sub-tenants · ⤓ = inherited binding · – = no own cap</text><text x="24" y="262" class="note">Treegrid (ARIA), 2 levels open by default; selecting a row opens effective values with "Inherited from" sources.</text></svg>
