# Local development stack: PostgreSQL 16, control node (api), worker; optional Ollama.
#   docker compose up --build
#   docker compose --profile ollama up --build
# Default credentials are for local use only.
name: openagentix

x-common-env: &common-env
  NODE_ENV: production
  # Password kept separate from the URL (no URL encoding needed); PG* variables work as well.
  OAX_DATABASE_URL: postgres://openagentix@postgres:5432/openagentix
  OAX_DATABASE_PASSWORD: openagentix
  OAX_RUN_TOKEN_SECRET: local-development-run-token-secret-0001
  OAX_LOG_LEVEL: info
  # JSON list of providers; the simulated provider needs no network and no API key.
  OAX_PROVIDERS: '[{"kind":"simulated","name":"simulated"},{"kind":"ollama","name":"ollama","baseUrl":"http://ollama:11434"}]'

# Container runner (opt-in, docs/runners.md): set these in .env and start with
#   docker compose --profile container-runner up --scale worker=0
# Nothing isolating runs unless OAX_CONTAINER_RUNNER_ENABLED=true.
x-container-env: &container-env
  OAX_RUNNERS_ENABLED: ${OAX_RUNNERS_ENABLED:-in-process}
  OAX_CONTAINER_RUNNER_ENABLED: ${OAX_CONTAINER_RUNNER_ENABLED:-false}
  OAX_CONTAINER_ENGINE_URL: http://socket-proxy:2375
  # Run node image pinned by digest, e.g. ghcr.io/open-agentix/open-agentix-run-node@sha256:...
  OAX_CONTAINER_IMAGE: ${OAX_CONTAINER_IMAGE:-}
  OAX_CONTAINER_NETWORK: openagentix-nodes
  # Step egress is off unless a grant secret is set; the operator ceiling decides what steps may
  # declare. The secret itself is NOT part of this block: only the worker and the proxy receive it.
  OAX_CONTAINER_EGRESS_PROXY_URL: ${OAX_CONTAINER_EGRESS_GRANT_SECRET:+http://egress-proxy:3128}
  OAX_CONTAINER_EGRESS_ALLOW: ${OAX_CONTAINER_EGRESS_ALLOW:-}
  OAX_NODE_CONTROL_URL: http://api:8080

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openagentix
      POSTGRES_PASSWORD: openagentix
      POSTGRES_DB: openagentix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U openagentix']
      interval: 5s
      retries: 20

  api:
    build: { context: ., target: api }
    image: ghcr.io/open-agentix/open-agentix-api:dev
    environment:
      <<: [*common-env, *container-env]
      OAX_PUBLIC_URL: http://localhost:8080
      OAX_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      OAX_BOOTSTRAP_ADMIN_PASSWORD: change-me-please-123
      OAX_CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      OAX_UI_URL: http://localhost:3000
      # Webhook signing secret referenced by event sources as "demo-hook".
      OAX_SECRET_DEMO_HOOK: demo-webhook-secret
    ports: ['8080:8080']
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    # `nodes` is an internal network: run nodes reach the control node here and nothing else.
    networks: [default, nodes]
    depends_on:
      postgres: { condition: service_healthy }

  worker:
    build: { context: ., target: worker }
    image: ghcr.io/open-agentix/open-agentix-worker:dev
    environment:
      <<: *common-env
      OAX_DB_MIGRATE_ON_START: 'false'
      OAX_WORKER_CONCURRENCY: '4'
      # Registers the built-in demo MCP servers (cve-db, tickets) for in-memory connections.
      OAX_DEMO_MCP: 'true'
      OAX_WORKER_HTTP_PORT: '9090'
    ports: ['9090:9090']
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      api: { condition: service_healthy }

  # --- container runner profile: one hardened container per isolated step ---

  # The only holder of the Docker socket. It allows container create/start/wait/stop/kill/remove and
  # network inspect and denies exec, build, images, volumes, swarm and everything else.
  # HONEST WARNING: this proxy cannot inspect request bodies. Whoever can talk to it (the worker) can
  # still create a privileged container with a host bind mount, which is root on the host. The
  # worker's own create options are hardened and checked, but a compromised worker is not contained
  # by this proxy. For production use rootless Podman or a body-filtering proxy, and pin this image
  # by digest. This profile is for evaluation.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: ['container-runner']
    environment:
      CONTAINERS: '1'
      NETWORKS: '1'
      POST: '1'
      EXEC: '0'
      BUILD: '0'
      IMAGES: '0'
      VOLUMES: '0'
      SERVICES: '0'
      SWARM: '0'
      SECRETS: '0'
      CONFIGS: '0'
      NODES: '0'
      PLUGINS: '0'
      SYSTEM: '0'
      TASKS: '0'
      INFO: '0'
      AUTH: '0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [socket]
    read_only: true
    tmpfs: ['/run']
    security_opt: ['no-new-privileges:true']

  # The egress proxy: its OWN service, on the internal node network and an egress network only
  # (never on `default` or `socket`). Stateless: it verifies per-node grants signed with
  # OAX_CONTAINER_EGRESS_GRANT_SECRET. Private ranges stay closed unless
  # OAX_CONTAINER_EGRESS_PRIVATE_ALLOW lists them. Compose evaluates variables of services in
  # inactive profiles too, so the secret defaults to empty here (a `:?` would break every
  # `docker compose up`); the proxy refuses to start without a secret of at least 32 characters.
  egress-proxy:
    build: { context: ., target: egress-proxy }
    image: ghcr.io/open-agentix/open-agentix-egress-proxy:dev
    profiles: ['container-runner']
    environment:
      OAX_CONTAINER_EGRESS_GRANT_SECRET: ${OAX_CONTAINER_EGRESS_GRANT_SECRET:-}
      OAX_CONTAINER_EGRESS_ALLOW: ${OAX_CONTAINER_EGRESS_ALLOW:-}
      OAX_CONTAINER_EGRESS_PRIVATE_ALLOW: ${OAX_CONTAINER_EGRESS_PRIVATE_ALLOW:-}
      OAX_AIRGAPPED: ${OAX_AIRGAPPED:-false}
      OAX_AIRGAPPED_ALLOW: ${OAX_AIRGAPPED_ALLOW:-}
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    networks: [nodes, egress]

  # The orchestrating worker with the container runner. Scale the plain worker to 0 so that runs
  # that need isolation are never claimed by a worker without a container runner.
  worker-container:
    build: { context: ., target: worker }
    image: ghcr.io/open-agentix/open-agentix-worker:dev
    profiles: ['container-runner']
    environment:
      <<: [*common-env, *container-env]
      OAX_CONTAINER_EGRESS_GRANT_SECRET: ${OAX_CONTAINER_EGRESS_GRANT_SECRET:-}
      OAX_DB_MIGRATE_ON_START: 'false'
      OAX_WORKER_CONCURRENCY: '4'
      OAX_WORKER_HTTP_PORT: '9090'
    read_only: true
    tmpfs: ['/tmp']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    # Not on `nodes`: only the control node and the egress proxy are neighbours of run nodes.
    networks: [default, socket]
    depends_on:
      api: { condition: service_healthy }
      socket-proxy: { condition: service_started }

  ui:
    build:
      context: .
      dockerfile: apps/ui/Dockerfile
      args:
        # Without an ingress the browser talks to the API directly.
        VITE_OAX_API_URL: http://localhost:8080
    image: ghcr.io/open-agentix/open-agentix-ui:dev
    ports: ['3000:8080']
    read_only: true
    tmpfs: ['/tmp', '/var/cache/nginx']
    security_opt: ['no-new-privileges:true']
    cap_drop: ['ALL']
    depends_on:
      api: { condition: service_healthy }

  ollama:
    image: ollama/ollama:0.12.3
    profiles: ['ollama']
    volumes:
      - ollama:/root/.ollama

networks:
  # Run nodes live here: no route to the internet, only the control node and the egress proxy.
  nodes:
    name: openagentix-nodes
    internal: true
  socket:
    internal: true
  # Outbound access for the egress proxy only.
  egress:
    name: openagentix-egress

volumes:
  pgdata:
  ollama:
