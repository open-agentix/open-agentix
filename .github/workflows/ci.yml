name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, typecheck, test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    # Real PostgreSQL for the tests that skip without OAX_TEST_DATABASE_URL (migrations, races).
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_PASSWORD: oax-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: test with coverage gate (>= 80 % lines/branches/functions/statements)
        env:
          OAX_TEST_DATABASE_URL: postgres://postgres:oax-ci-only@localhost:5432/postgres
        run: pnpm test:coverage
      - run: pnpm build
      - name: UI typecheck, tests with coverage, build, bundle budget and offline check
        if: matrix.node == '22'
        run: |
          pnpm --filter @openagentix/ui typecheck
          pnpm test:ui
          pnpm --filter @openagentix/ui build
          pnpm --filter @openagentix/ui size
          pnpm --filter @openagentix/ui check:offline
      - name: Drizzle schema, snapshots and migrations are in sync
        if: matrix.node == '22'
        run: |
          pnpm --filter @openagentix/api exec drizzle-kit generate --name ci_drift_check
          git status --porcelain apps/api/drizzle
          test -z "$(git status --porcelain apps/api/drizzle)"
      - name: OpenAPI document is up to date
        run: git diff --exit-code openapi.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == '22'
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  pr-title:
    name: Conventional Commit PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{1,100}$' \
            || { echo "PR title must follow Conventional Commits: $TITLE"; exit 1; }

  docker:
    name: container images
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - { target: api, file: Dockerfile }
          - { target: worker, file: Dockerfile }
          - { target: ui, file: apps/ui/Dockerfile }
          - { target: worker-claude, file: Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the demo compose files
        if: matrix.target == 'api'
        run: |
          docker compose -f docker-compose.demo.yml config -q
          docker compose -f docker-compose.demo.yml -f docker-compose.demo-claude.yml config -q
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          tags: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
