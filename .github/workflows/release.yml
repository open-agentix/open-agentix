name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  images:
    name: publish ${{ matrix.target }} image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          - { target: api, file: Dockerfile }
          - { target: worker, file: Dockerfile }
          - { target: ui, file: apps/ui/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: true
      - name: sign and attest (keyless)
        env:
          IMAGE: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.target }}.spdx.json "$IMAGE"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: images
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: create release with changelog notes and image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          digest() { docker buildx imagetools inspect "ghcr.io/open-agentix/open-agentix-$1:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          DIGEST_API=$(digest api)
          DIGEST_WORKER=$(digest worker)
          DIGEST_UI=$(digest ui)
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          {
            echo
            echo "## Images (signed with cosign keyless, SBOM attested)"
            echo
            echo "- \`ghcr.io/open-agentix/open-agentix-api:${version}\` \`${DIGEST_API}\`"
            echo "- \`ghcr.io/open-agentix/open-agentix-worker:${version}\` \`${DIGEST_WORKER}\`"
            echo "- \`ghcr.io/open-agentix/open-agentix-ui:${version}\` \`${DIGEST_UI}\`"
            echo
            echo "Verify: \`cosign verify ghcr.io/open-agentix/open-agentix-api@${DIGEST_API} --certificate-identity-regexp 'https://github.com/open-agentix/open-agentix/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
