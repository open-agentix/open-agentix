name: Release

on:
  push:
    tags: ['v*.*.*']
  # Manual run against an EXISTING tag (never creates or moves tags). See docs/releasing.md.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag on main, e.g. v1.2.3 or v1.2.3-rc.1'
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: verify tag and changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$REF_NAME"
          [ "$EVENT" = workflow_dispatch ] && tag="$INPUT_TAG"
          if ! printf '%s' "$tag" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a valid release tag (vX.Y.Z or vX.Y.Z-pre)"; exit 1
          fi
          git rev-parse --verify --quiet "refs/tags/$tag^{commit}" >/dev/null \
            || { echo "::error::tag $tag does not exist; create it first (the workflow never creates tags)"; exit 1; }
          if [ "$EVENT" = workflow_dispatch ]; then
            git merge-base --is-ancestor "refs/tags/$tag^{commit}" origin/main \
              || { echo "::error::tag $tag does not point at a commit on main"; exit 1; }
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::a GitHub release for $tag already exists"; exit 1
            fi
          fi
          version="${tag#v}"
          git show "refs/tags/$tag:CHANGELOG.md" | grep -Fq "## [$version]" \
            || { echo "::error::CHANGELOG.md at $tag has no '## [$version]' section"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  images:
    name: publish ${{ matrix.target }} image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    strategy:
      matrix:
        include:
          - { target: api, file: Dockerfile, platforms: 'linux/amd64' }
          - { target: worker, file: Dockerfile, platforms: 'linux/amd64,linux/arm64' }
          - { target: ui, file: apps/ui/Dockerfile, platforms: 'linux/amd64,linux/arm64' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.verify.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.verify.outputs.tag }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ needs.verify.outputs.tag }}
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-${{ matrix.target }}.spdx.json
          upload-artifact: true
      - name: sign and attest (keyless)
        env:
          IMAGE: ghcr.io/open-agentix/open-agentix-${{ matrix.target }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate sbom-${{ matrix.target }}.spdx.json "$IMAGE"

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [verify, images]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
      - name: create release with changelog notes and image digests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          version="${TAG#v}"
          digest() { docker buildx imagetools inspect "ghcr.io/open-agentix/open-agentix-$1:${version}" --format '{{json .Manifest.Digest}}' | tr -d '"'; }
          DIGEST_API=$(digest api)
          DIGEST_WORKER=$(digest worker)
          DIGEST_UI=$(digest ui)
          awk -v v="$version" '$0 ~ "^## \[" v "\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          {
            echo
            echo "## Images (signed with cosign keyless, SBOM attested)"
            echo
            echo "- \`ghcr.io/open-agentix/open-agentix-api:${version}\` \`${DIGEST_API}\`"
            echo "- \`ghcr.io/open-agentix/open-agentix-worker:${version}\` \`${DIGEST_WORKER}\`"
            echo "- \`ghcr.io/open-agentix/open-agentix-ui:${version}\` \`${DIGEST_UI}\`"
            echo
            echo "Verify: \`cosign verify ghcr.io/open-agentix/open-agentix-api@${DIGEST_API} --certificate-identity-regexp 'https://github.com/open-agentix/open-agentix/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> notes.md
          pre=()
          case "$TAG" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag "${pre[@]}"

  deploy-demo:
    name: deploy public demo
    needs: [verify, images, release]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: demo
    permissions:
      contents: read
    steps:
      - name: Deploy the demo stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          port: ${{ secrets.DEMO_SSH_PORT || 22 }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script_stop: true
          envs: TAG
          script: |
            set -euo pipefail
            TAG="${{ needs.verify.outputs.tag }}"
            DEPLOY_PATH="${{ secrets.DEMO_DEPLOY_PATH }}"
            mkdir -p "$DEPLOY_PATH"
            cd "$DEPLOY_PATH"
            git init >/dev/null 2>&1 || true
            git remote get origin >/dev/null 2>&1 || git remote add origin https://github.com/open-agentix/open-agentix.git
            git fetch --all --tags --prune origin
            git checkout --detach "$TAG"
            docker compose -f docker-compose.demo.yml down --remove-orphans || true
            docker compose -f docker-compose.demo.yml pull --quiet || true
            docker compose -f docker-compose.demo.yml up -d --build --force-recreate --remove-orphans
            docker compose -f docker-compose.demo.yml ps
            docker image prune -f
