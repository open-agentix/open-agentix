name: Refresh model catalog

# The platform never fetches models.dev at run time. This job downloads it on a GitHub-hosted
# runner once a week, converts it with scripts/import-models-dev.mjs (field whitelist, safe ids,
# plausible prices) and opens a pull request that a maintainer reviews before the snapshot changes.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: download and convert
        run: |
          curl --fail --silent --show-error --max-time 60 --output "$RUNNER_TEMP/api.json" https://models.dev/api.json
          node scripts/import-models-dev.mjs "$RUNNER_TEMP/api.json"
      - name: open a pull request when the snapshot changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the date and the source hash changing (models.dev edits outside the imported
          # providers) is not worth a pull request.
          git diff --quiet -I'"snapshotDate"' -I'"sha256"' -- packages/providers/catalog/models.json && exit 0
          branch="chore/catalog-refresh-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packages/providers/catalog/models.json
          git commit -s -m "chore(catalog): refresh models.dev snapshot" \
            -m "Generated by scripts/import-models-dev.mjs from https://models.dev/api.json. Review the price and model changes before merging."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(catalog): refresh models.dev snapshot" \
            --body "Weekly refresh of the pinned model catalog. Check the diff of prices and removed models; the snapshot carries the SHA-256 of its models.dev source."
