# Conformance case 3.3-extension-fields
# Spec section 3.3: Fields starting with x- may appear in any object and are ignored.
# Expected: valid
apiVersion: awp.agenticworkflowprotocol.org/v1alpha1
kind: Workflow
metadata:
  name: conformance-base
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
  x-meta:
    any:
      - thing
spec:
  inputs:
    - name: repo
      type: string
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 1
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
        x-model: 1
      tools:
        - type: mcp
          server: tools
  workflow:
    - id: analyze
      agent: worker
      task: Analyze ${{ inputs.repo }}.
      outputs:
        - name: report
      x-step: ok
    - id: apply
      agent: worker
      task: Apply ${{ steps.analyze.outputs.report }}.
      dependsOn:
        - analyze
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
    x-perm: null
  x-spec: true
x-top: 1
