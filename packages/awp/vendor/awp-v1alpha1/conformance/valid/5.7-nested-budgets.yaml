# Conformance case 5.7-nested-budgets
# Spec section 5.7: Budgets on workflow, agent and step; retries do not exceed maxRetries.
# Expected: valid
apiVersion: awp.agenticworkflowprotocol.org/v1alpha1
kind: Workflow
metadata:
  name: conformance-base
  version: 1.0.0
  owner:
    team: conformance-team
  classification: internal
  risk:
    level: low
spec:
  inputs:
    - name: repo
      type: string
      required: true
  budget:
    maxCostUsd: 1
    maxSteps: 10
    maxDuration: 10m
    resources:
      maxRetries: 2
      maxConcurrency: 1
  secrets:
    - name: TOOLS_TOKEN
      source: secret-manager
      scope:
        - tools
  mcpServers:
    - name: tools
      transport: streamable-http
      url: https://mcp.example.com/tools
      auth:
        secretRef: TOOLS_TOKEN
  actionGroups:
    tools.read:
      - tools.read_file
  agents:
    - id: worker
      model:
        provider: ollama
        name: qwen3
      tools:
        - type: mcp
          server: tools
      budget:
        maxCostUsd: 0.5
  workflow:
    - id: analyze
      agent: worker
      task: Analyze ${{ inputs.repo }}.
      outputs:
        - name: report
      budget:
        maxSteps: 3
        resources:
          maxTokens: 1000
      retries: 2
    - id: apply
      agent: worker
      task: Apply ${{ steps.analyze.outputs.report }}.
      dependsOn:
        - analyze
  permissions:
    default: deny
    tools:
      tools.read:
        allow: true
