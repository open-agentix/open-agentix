# Conformance case 3.4-duplicate-rule-id
# Spec section 3.4: Identifiers MUST be unique within their list (rules).
# Expected: invalid (id.duplicate at /spec/rules/1/id)
apiVersion: awp.agenticworkflowprotocol.org/v1alpha1
kind: Policy
metadata:
  name: conformance-policy
  version: 1.0.0
  owner:
    team: governance-team
spec:
  rules:
    - id: deploy-needs-approval
      when:
        action: production.deploy
      effect: requireApproval
      approval:
        approvers:
          - role: release-manager
    - id: deploy-needs-approval
      when:
        action: production.deploy
      effect: requireApproval
      approval:
        approvers:
          - role: release-manager
