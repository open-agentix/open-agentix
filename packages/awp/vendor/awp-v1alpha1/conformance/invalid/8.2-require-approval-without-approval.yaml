# Conformance case 8.2-require-approval-without-approval
# Spec section 8.2: approval is REQUIRED for requireApproval.
# Expected: invalid (schema.required at /spec/rules/0)
apiVersion: awp.agenticworkflowprotocol.org/v1alpha1
kind: Policy
metadata:
  name: conformance-policy
  version: 1.0.0
  owner:
    team: governance-team
spec:
  rules:
    - id: deploy-needs-approval
      when:
        action: production.deploy
      effect: requireApproval
