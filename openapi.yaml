                    type: string
                    enum:
                      - agents:read
                      - agents:write
                      - agents:publish
                      - runs:read
                      - runs:execute
                      - runs:cancel
                      - runs:approve
                      - events:read
                      - sources:read
                      - sources:write
                      - connections:read
                      - connections:write
                      - policies:read
                      - policies:write
                      - audit:read
                      - audit:verify
                      - audit:export
                      - costs:read
                      - users:read
                      - users:write
                      - tokens:read
                      - tokens:write
                      - settings:read
