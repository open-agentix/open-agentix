                      - type: "null"
                  expiresAt:
                    type: string
                    description: ISO 8601 timestamp
                  lastUsedAt:
                    anyOf:
                      - type: string
                        description: ISO 8601 timestamp
                      - type: "null"
                  createdAt:
                    type: string
                    description: ISO 8601 timestamp
                  token:
                    type: string
                    description: shown once; store it securely
                required:
                  - id
                  - name
                  - kind
                  - scopes
                  - expiresAt
                  - lastUsedAt
                  - createdAt
                  - token
